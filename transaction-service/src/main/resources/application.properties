server.port=8082
spring.application.name=transaction-service
spring.config.import=optional:configserver:http://localhost:8888

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:h2:mem:transactiondb
spring.datasource.console.enabled=true

# Documentation Swagger & GraphiQL
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.graphql.graphiql.enabled=true

# Valeur locale par défaut si le config server n'est pas joint
bank.transaction.max-amount=1000

# Resilience4J Circuit Breaker
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s