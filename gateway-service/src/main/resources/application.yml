server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:4200"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: false
          routes:
            - id: account-service
              uri: http://localhost:8081
              predicates:
                - Path=/account-service/**
              filters:
                - StripPrefix=1

            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path=/transaction-service/**
              filters:
                - StripPrefix=1  

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/